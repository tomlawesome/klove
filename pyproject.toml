[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "klove"
version = "0.1.0.dev0"
description = "Fail-closed Grove Control to Klipper interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27,<2",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
klove = "klove.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/klove"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["klove"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.json]
output = "coverage.json"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "ARG", "ASYNC", "B", "E", "F", "I", "PL", "RUF", "S", "SIM", "UP"]
ignore = [
  "ANN401",
  "COM812",
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "ASYNC109", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
