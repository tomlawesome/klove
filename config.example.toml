[api]
# The example Compose file publishes this only on host loopback.
listen_host = "0.0.0.0"
listen_port = 8080
token_file = "/run/secrets/klove_api_token"

[registry]
database_file = "/var/lib/klove/printer-registry.sqlite3"
secret_directory = "/var/lib/klove/registry-secrets"
allowed_probe_cidrs = ["192.168.1.0/24"]

[onboarding]
# The owner-session substrate exists, but lifecycle routes are not exposed yet.
enabled = false
session_capacity = 128
session_inactivity_seconds = 900
session_absolute_seconds = 1800

[control]
enabled = true
request_timeout_seconds = 10
confirmation_timeout_seconds = 5
poll_interval_seconds = 0.1
idempotency_capacity = 1024

[dispatch]
# The internal start service remains disabled unless this and one printer opt in.
enabled = false
journal_file = "/var/lib/klove/start-journal.sqlite3"
request_timeout_seconds = 10.0
confirmation_timeout_seconds = 10.0
poll_interval_seconds = 0.1

[grove_bridge]
enabled = true
# Bind only inside Compose's private RFC1918 network. The advertised address
# must exactly match the static address assigned in compose.example.yml.
listen_host = "0.0.0.0"
mqtt_port = 8883
ftps_control_port = 990
ftps_passive_port_min = 50000
ftps_passive_port_max = 50009
ftps_advertised_ipv4 = "172.30.67.10"
tls_certificate_file = "/run/secrets/klove_ftps_certificate.pem"
tls_private_key_file = "/run/secrets/klove_ftps_private_key.pem"
mqtt_journal_file = "/var/lib/klove/mqtt-ingress.sqlite3"
staging_directory = "/var/lib/klove/ftps-staging"

[artifacts]
max_zip_entries = 512
max_zip_metadata_bytes = 16777216
max_archive_compressed_bytes = 536870912
max_archive_expanded_bytes = 2147483648
max_compression_ratio = 100
max_gcode_bytes = 1073741824
max_gcode_header_bytes = 65536
max_gcode_line_bytes = 8192
upload_timeout_seconds = 300.0
metadata_wait_seconds = 30.0
metadata_poll_interval_seconds = 0.1
upload_idempotency_capacity = 1024

[[printers]]
id = "voron-24"
# Generate this once per physical printer; do not reuse the example UUID.
uuid = "11111111-1111-4111-8111-111111111111"
endpoint = "http://voron-24.local:7125"
api_key_file = "/run/secrets/voron_24_moonraker_api_key"
allow_insecure_http = true
verify_tls = false
control_enabled = true
dispatch_enabled = false

[[printers.safety_profiles]]
profile_version = "1"
printer_uuid = "11111111-1111-4111-8111-111111111111"
# Increase this whenever any profile field changes, including after a reversion.
generation = 1
slicer_profile_id = "klipper-voron-24-0.4"

[printers.safety_profiles.compatibility]
gcode_flavor = "klipper"
nozzle_diameter_micrometres = 400
build_plate_id = "textured-pei"

[printers.safety_profiles.compatibility.build_volume]
x_micrometres = 350000
y_micrometres = 350000
z_micrometres = 350000
