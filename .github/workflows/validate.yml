name: Validate Klove

on:
  pull_request:
    branches: [main, dev, preview]
  push:
    branches: [preview, "hotfix/**"]
  workflow_dispatch:

concurrency:
  group: klove-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: Static, tests, and 100% safety coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-build.lock
      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Run deterministic fast checks
        run: sh scripts/test-fast.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: klove-coverage
          path: coverage.json
          retention-days: 14

  moonraker-sim:
    name: Native Moonraker integration
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CI: "true"
      KLOVE_SIM_ALLOW_ROOTFUL_CI: "1"
      KLOVE_SIM_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Exercise real Klipper, Moonraker, and Klove contract
        run: sh scripts/test-moonraker-sim.sh

  browser:
    name: Secure embedded-frame browser boundary
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install lockfile-pinned browser test dependencies
        run: npm ci
      - name: Install Playwright's lockfile-pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise the secure parent/frame boundary
        run: sh scripts/test-browser.sh

  exact-container:
    name: Exact container contract
    if: >-
      (github.event_name == 'push' && github.ref_name == 'preview') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci: acceptance'))
    needs: [fast, browser, moonraker-sim]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build and load exact image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_BRANCH=${{ github.ref_name }}
          context: .
          load: true
          push: false
          tags: klove:preview-test
      - name: Verify immutable runtime contract
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python klove:preview-test -c \
            'from klove.domain.translation import decode_grove_request; assert decode_grove_request({"print":{"command":"gcode_line","param":"M112","sequence_id":"1"}}).accepted is False'
      - name: Reject high-severity image vulnerabilities and produce SBOM
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
        run: |
          mkdir -p .klove-supply-chain .klove-trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/.klove-trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --exit-code 1 --severity HIGH,CRITICAL klove:preview-test
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/.klove-trivy-cache:/root/.cache/trivy" \
            --volume "${PWD}/.klove-supply-chain:/evidence" \
            "${TRIVY_IMAGE}" image --skip-db-update --format spdx-json \
            --output /evidence/image.spdx.json klove:preview-test
      - name: Log in to publish the tested preview image
        if: github.event_name == 'push' && github.ref_name == 'preview'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested preview
        if: github.event_name == 'push' && github.ref_name == 'preview'
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE,,}"
          candidate="preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          docker tag klove:preview-test "${image}:${candidate}"
          docker push "${image}:${candidate}"
          digest="$(docker buildx imagetools inspect "${image}:${candidate}" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "${digest}"
          docker buildx imagetools create --tag "${image}:preview" "${image}@${digest}"
          preview_digest="$(docker buildx imagetools inspect "${image}:preview" | awk '$1 == "Digest:" {print $2; exit}')"
          test "${preview_digest}" = "${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "candidate=${image}:${candidate}" >> "${GITHUB_OUTPUT}"
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref_name == 'preview'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest software bill of materials
        if: github.event_name == 'push' && github.ref_name == 'preview'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: .klove-supply-chain/image.spdx.json
          push-to-registry: true
          create-storage-record: false

  verify-preview:
    name: Verify tested preview for stable merge
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [fast, browser, moonraker-sim]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify preview source and attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test "${PR_HEAD_BRANCH}" = preview
          image="${IMAGE,,}"
          digest="$(docker buildx imagetools inspect "${image}:preview" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "${digest}"
          gh attestation verify "oci://${image}@${digest}" --repo "${GITHUB_REPOSITORY}"
          docker pull "${image}@${digest}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}@${digest}")"
          source_branch="$(docker image inspect --format '{{ index .Config.Labels "io.github.tomlawesome.klove.source-branch" }}' "${image}@${digest}")"
          test "${source_branch}" = preview
          test "${revision}" = "${EXPECTED_REVISION}"
