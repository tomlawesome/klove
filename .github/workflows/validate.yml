# GitHub is the mirror; the gate that judges a change runs on GitLab
# (.gitlab-ci.yml, AGENTS.md "Where development happens"). What remains here
# is only what needs GitHub itself -- the ghcr registry and the attestation
# identity -- plus the FTPS container check until #180 ports it. The `fast`,
# `browser` and `moonraker-sim` jobs were removed on 2026-09-05 (#173): the
# same scripts run as test:fast, test:browser and test:moonraker-sim on
# GitLab before any branch reaches this repository, so re-running them here
# only queued behind GitHub's shared runners.
#
# `preview` arrives by the mirror push after a dev -> preview merge on
# GitLab; no pull request is ever opened here, so there is no pull_request
# trigger.
name: Validate Klove

on:
  push:
    branches: [preview, "hotfix/**"]
  workflow_dispatch:

concurrency:
  group: klove-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ftps-container:
    name: Confined FTPS production container
    if: >-
      (github.event_name == 'push' && github.ref_name == 'preview') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      KLOVE_FTPS_ALLOW_ROOTFUL_CI: "1"
      KLOVE_FTPS_RUN_ID: ftps-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Exercise the private FTPS container boundary
        run: sh scripts/test-ftps-container.sh

  exact-container:
    name: Exact container contract
    if: >-
      (github.event_name == 'push' && github.ref_name == 'preview') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build and load exact image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_BRANCH=${{ github.ref_name }}
          context: .
          load: true
          push: false
          tags: klove:preview-test
      - name: Verify immutable runtime contract
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python klove:preview-test -c \
            'from klove.domain.translation import decode_grove_request; assert decode_grove_request({"print":{"command":"gcode_line","param":"M112","sequence_id":"1"}}).accepted is False'
      - name: Reject high-severity image vulnerabilities and produce SBOM
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
        run: |
          mkdir -p .klove-supply-chain .klove-trivy-cache
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/.klove-trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --exit-code 1 --severity HIGH,CRITICAL klove:preview-test
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${PWD}/.klove-trivy-cache:/root/.cache/trivy" \
            --volume "${PWD}/.klove-supply-chain:/evidence" \
            "${TRIVY_IMAGE}" image --skip-db-update --format spdx-json \
            --output /evidence/image.spdx.json klove:preview-test
      - name: Log in to publish the tested preview image
        if: github.event_name == 'push' && github.ref_name == 'preview'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested preview
        if: github.event_name == 'push' && github.ref_name == 'preview'
        id: publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE,,}"
          candidate="preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          docker tag klove:preview-test "${image}:${candidate}"
          docker push "${image}:${candidate}"
          digest="$(docker buildx imagetools inspect "${image}:${candidate}" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "${digest}"
          docker buildx imagetools create --tag "${image}:preview" "${image}@${digest}"
          preview_digest="$(docker buildx imagetools inspect "${image}:preview" | awk '$1 == "Digest:" {print $2; exit}')"
          test "${preview_digest}" = "${digest}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "candidate=${image}:${candidate}" >> "${GITHUB_OUTPUT}"
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref_name == 'preview'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest software bill of materials
        if: github.event_name == 'push' && github.ref_name == 'preview'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: .klove-supply-chain/image.spdx.json
          push-to-registry: true
          create-storage-record: false
