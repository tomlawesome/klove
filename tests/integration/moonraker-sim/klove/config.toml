[api]
listen_host = "0.0.0.0"
listen_port = 8080
token_file = "/run/klove-secrets/klove-token"

[registry]
database_file = "/var/lib/klove/printer-registry.sqlite3"
secret_directory = "/var/lib/klove/registry-secrets"
allowed_probe_cidrs = ["172.16.0.0/12"]

[dispatch]
journal_file = "/var/lib/klove/start-journal.sqlite3"

[control]
enabled = true
request_timeout_seconds = 3.0
confirmation_timeout_seconds = 8.0
poll_interval_seconds = 0.05
idempotency_capacity = 32

[[printers]]
id = "simulated-printer"
uuid = "11111111-1111-4111-8111-111111111111"
endpoint = "http://moonraker-proxy:7125"
api_key_file = "/run/klove-secrets/moonraker-api-key"
allow_insecure_http = true
verify_tls = false
control_enabled = true
